</style></head><body><header><button class="brand" onclick="home()" aria-label="Return to home"><span class="maple">✳</span> TEST YOUR HDIC!!</button><span class="edition">Canada · A personal perspective</span></header><main id="app"></main><footer><span>A little reflection. A different perspective.</span><button onclick="about()">About this experiment ↗</button></footer><script>
const labels = ['Very democratic', 'Somewhat democratic', 'Neutral / mixed', 'Somewhat undemocratic', 'Very undemocratic'];
// All characters and opinions below are AI-written fiction, not sampled responses.
const people = [
  {name:'Alex',age:29, socialClass:'Working class', ethnicity:'White Canadian'},
  {name:'Maya',age:46, socialClass:'Middle class', ethnicity:'South Asian Canadian'},
  {name:'Jordan',age:35, socialClass:'Middle class', ethnicity:'First Nations (Cree)'},
  {name:'Camille',age:63, socialClass:'Upper middle class', ethnicity:'White Québécois'},
  {name:'Daniel',age:51, socialClass:'Working class', ethnicity:'Black Canadian'},
  {name:'Lena',age:22, socialClass:'Working class', ethnicity:'Chinese Canadian'},
  {name:'Samira',age:38, socialClass:'Upper middle class', ethnicity:'Arab Canadian'},
  {name:'Noah',age:57, socialClass:'Middle class', ethnicity:'Métis'},
  {name:'Isabel',age:32, socialClass:'Middle class', ethnicity:'Latin American Canadian'},
  {name:'Thomas',age:71, socialClass:'Upper middle class', ethnicity:'White Canadian'}
];
// A voice references a fictional character, a scale position, and one short reason.
const questions = [
  {cat:'Accountability',title:'Constitutional Monarchy',context:'The king or queen is Canada’s head of state, but their powers are limited by the Constitution and constitutional conventions. In practice, most powers are exercised on the advice of elected governments.',voices:[[0,4,'I think the head of state should be chosen by the people, not by inheritance.'],[1,1,'I see a limited monarch as compatible with a government accountable to voters.']]},
  {cat:'Representation',title:'Representative / Parliamentary Democracy',context:'Citizens elect representatives to debate and make laws on their behalf. The government must maintain the confidence of the elected House of Commons.',voices:[[4,0,'I can vote for someone who speaks for my community and replace them at the next election.'],[3,3,'I wish I had more direct influence between elections.']]},
  {cat:'Representation',title:'Federal System',context:'Canada divides constitutional powers between the federal and provincial governments. Territorial governments exercise powers delegated by the federal government.',voices:[[6,1,'Sharing power lets different regions respond to their own needs.']]},
  {cat:'Accountability',title:'Governor-General',context:'The Governor General represents the monarch in Canada. Their duties include granting royal assent to bills, normally following constitutional conventions and acting on ministerial advice.',voices:[[5,3,'An unelected representative still has a formal role in turning bills into law.'],[9,1,'I see the role as a constitutional safeguard, while elected politicians make most decisions.']]},
  {cat:'Accountability',title:'Prime Minister',context:'The Prime Minister leads Canada’s government. The Governor General appoints the person best placed to command the confidence of the House of Commons, usually the leader of the party with the most seats.',voices:[[1,1,'The need to keep the confidence of elected MPs gives the leader democratic legitimacy.'],[0,3,'I worry that too much decision-making power is concentrated in one office.']]},
  {cat:'Representation',title:'House of Commons',context:'The House of Commons is the elected chamber of Parliament. Its 343 MPs represent ridings, debate and vote on legislation, approve spending, and hold the government to account.',voices:[[2,1,'Having a local MP gives me a clear person to question about federal decisions.'],[8,2,'Local representation matters, but party discipline can make my concerns feel distant.']]},
  {cat:'Representation',title:'Senate',context:'The Senate is Parliament’s upper chamber, with up to 105 appointed senators. It reviews legislation and can amend or reject bills passed by the House of Commons, subject to constitutional limits.',voices:[[3,1,'A second chamber can take time to examine problems the elected chamber missed.'],[4,4,'I think people with the power to block laws should have to face voters.']]},
  {cat:'Accountability',title:'Branches of Government',context:'Canada has three branches: the legislative branch makes laws, the executive carries them out, and the judicial branch interprets and applies them. In the parliamentary system, the executive and legislative branches overlap.',voices:[[7,0,'Different institutions can check the use of power instead of leaving it all in one place.']]},
  {cat:'Participation',title:'Lobbying',context:'Lobbying means communicating with public office holders to influence decisions. Individuals and organizations can advocate for change; peaceful protest is another form of political participation. Some lobbying activities must be registered.',voices:[[6,3,'I worry that organizations with paid lobbyists get more access than people like my neighbours.'],[5,1,'Organizing with others gives me a way to bring an issue to decision-makers.']]},
  {cat:'Rights & equality',title:'Charter of Rights and Freedoms',context:'The Canadian Charter of Rights and Freedoms protects fundamental freedoms and democratic, mobility, legal, equality and language rights. Rights can be subject to justified limits; some can be overridden temporarily through the notwithstanding clause.',voices:[[8,0,'Legal protection for expression and equality helps me participate without fear.'],[2,2,'Written protections matter to me, but access to justice affects how real those rights feel.']]},
  {cat:'Accountability',title:'Order-in-Council',context:'An order-in-council is a formal decision made by the Governor General, normally on Cabinet’s recommendation. It can make appointments or regulations under existing legal authority, without passing a new Act of Parliament each time.',voices:[[9,1,'I think elected governments need a practical way to carry out laws Parliament has already passed.'],[1,3,'Decisions made without a new parliamentary vote deserve especially close scrutiny.']]},
  {cat:'Participation',title:'How a Bill Becomes a Law',context:'A federal bill usually goes through readings, committee study and votes in both the House of Commons and the Senate. Both chambers must agree on the same text, and the bill must receive royal assent to become law.',voices:[[0,1,'Multiple stages create chances to debate a proposal and find mistakes.'],[7,2,'The process is thorough, but I want public input to have a visible effect on the final text.']]},
  {cat:'Rights & equality',title:'Indigenous Self Government',context:'Indigenous self-government concerns the right of First Nations, Inuit and Métis peoples to govern their own affairs, including lands, cultures, languages and public services. Powers and arrangements vary across nations, laws and agreements.',voices:[[2,0,'Decisions about our community should be shaped by the people who live with them.'],[3,1,'I see self-government as a way to make public decisions more responsive to distinct communities.']]},
  {cat:'Representation',title:'First Past the Post',context:'In each federal riding, the candidate with the most votes wins a seat, even without a majority. A party can win more seats despite receiving fewer votes nationwide than another party. The government must command the confidence of the House.',voices:[[5,4,'I want seat totals to reflect the share of votes more closely.'],[4,1,'I like knowing which single representative is responsible for my riding.']]},
  {cat:'Rights & equality',title:'Constitution',context:'The Constitution is Canada’s supreme law. It sets out institutions, divides powers and protects rights. Formal amendments follow different procedures depending on the issue; many require agreement from Parliament and several provinces, making major change difficult.',voices:[[8,0,'Requiring broad agreement helps protect basic rights from a temporary political majority.'],[6,3,'Rules that are very hard to amend can also make needed reforms feel out of reach.']]}
];
let answers = questions.map(() => null), index = 0, screen = 'home';
const app = document.getElementById('app');
function show(html) {
  app.innerHTML = html;
  window.scrollTo({top:0,behavior:'instant'});
  app.setAttribute('tabindex','-1'); app.focus({preventScroll:true});
}
function home() {
  screen = 'home';
  show(`<section class="hero"><div><div class="eyebrow"><span class="dot"></span> One country. Many perspectives.</div><h1>TEST YOUR <em>HDIC!!</em><span class="title-expansion">(HOW DEMOCRACY IS CANADA)</span></h1><p class="lead">Democracy looks different depending on where you stand. Explore fifteen ideas about government — and discover where you stand.</p><button class="primary" onclick="start()">${answers.some(a=>a!==null)?'Continue your reflection':'Find your perspective'} <span>↗</span></button><p class="fine">15 questions &nbsp;·&nbsp; About 6 minutes &nbsp;·&nbsp; No sign-up</p></div><div class="art" role="img" aria-label="An abstract red maple leaf surrounded by concentric circles"><div class="art-grid"></div><span class="art-top">A STUDY IN PERSPECTIVE</span><span class="art-index">01—15</span><div class="leaf"></div><span class="art-label">SAME COUNTRY.<br>DIFFERENT POINTS OF VIEW.</span></div></section><section class="steps"><div class="step"><span>01</span><div><h3>Explore an idea.</h3><p>A keyword and a short introduction to government in Canada.</p></div></div><div class="step"><span>02</span><div><h3>Make your own call.</h3><p>Rate it, then hover over a glowing circle to meet a fictional perspective.</p></div></div><div class="step"><span>03</span><div><h3>See the bigger picture.</h3><p>Get a personal democracy score. A reflection, not a verdict.</p></div></div></section>`);
}
function start(){renderQuestion();}
function pick(value){answers[index]=value;renderQuestion(false);}
function personaCircles(q) {
  return `<section class="perspectives" aria-label="AI-generated perspectives"><span class="sample">AI-generated fiction · Not real responses</span><h3>Different lives. Different views.</h3><p class="persona-help" role="status">${q.voices.length===1?'One circle is':'Two circles are'} glowing. Hover, focus or tap to discover a perspective.</p><div class="circle-grid">${labels.map((label,rating)=>{
    const voice=q.voices.find(v=>v[1]===rating), p=voice?people[voice[0]]:null;
    return `<div class="person-slot"><div class="circle-wrap"><button class="person-circle ${voice?'lit':''}" ${voice?`onclick="togglePersona(this)" aria-expanded="false" aria-controls="persona-${rating}" aria-label="${label}: open an AI-generated fictional perspective"`:'disabled aria-label="'+label+': no fictional perspective"'}>${voice?'✦':'·'}</button><span class="circle-caption">${label}</span>${voice?`<div class="persona-card" id="persona-${rating}" role="region" aria-label="${p.name}, fictional perspective"><span class="sample">AI-generated fictional person</span><h4>${p.name} · ${label}</h4><dl class="persona-meta"><dt>Age</dt><dd>${p.age}</dd><dt>Class</dt><dd>${p.socialClass}</dd><dt>Ethnicity</dt><dd>${p.ethnicity}</dd></dl><blockquote>“${voice[2]}”</blockquote></div>`:''}</div></div>`;
  }).join('')}</div><p class="fine">Invented individuals, not survey data or views representative of any age, class or ethnic group.</p></section>`;
}
function togglePersona(button) {
  const slot=button.closest('.person-slot'), wasOpen=slot.classList.contains('open');
  closePersonas();
  if(!wasOpen){slot.classList.add('open');button.setAttribute('aria-expanded','true');}
  else button.blur();
}
function closePersonas(){document.querySelectorAll('.person-slot.open').forEach(slot=>{slot.classList.remove('open');slot.querySelector('button').setAttribute('aria-expanded','false');});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePersonas();if(document.activeElement?.classList.contains('person-circle'))document.activeElement.blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('.person-slot'))closePersonas();});
function renderQuestion(scroll=true) {
  screen='quiz'; const q=questions[index], chosen=answers[index];
  const html=`<section class="quiz"><div class="topline"><span class="eyebrow">${q.cat}</span><span class="fine">Question ${String(index+1).padStart(2,'0')} / ${questions.length}</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${index+1}" aria-label="Question progress"><span style="width:${(index+1)/questions.length*100}%"></span></div><h2 class="topic-title">${q.title}</h2><p class="topic-description">${q.context}</p><p class="prompt">In your view, how democratic is this aspect of Canada?</p><div class="ratings" role="group" aria-label="Rate this aspect of Canada">${labels.map((l,i)=>`<div class="rating-choice"><button class="rating ${chosen===i?'selected':''}" aria-label="${l}" aria-pressed="${chosen===i}" onclick="pick(${i})"><span class="rating-mark" aria-hidden="true"></span></button><span class="rating-label" aria-hidden="true">${l}</span></div>`).join('')}</div>${chosen!==null?personaCircles(q):''}<div class="actions"><button class="text-btn" onclick="back()">← ${index?'Previous':'Home'}</button><div>${chosen===null?'<button class="text-btn" style="margin-right:20px" onclick="skip()">Skip / unsure</button>':''}<button class="primary" onclick="next()" ${chosen===null?'disabled style="opacity:.35;cursor:default"':''}>${index===questions.length-1?'See my result':'Next question'} <span>→</span></button></div></div></section>`;
  if(scroll)show(html);else{const y=scrollY;app.innerHTML=html;window.scrollTo(0,y);}
}
function back(){if(index){index--;renderQuestion();}else home();}
function next(){if(answers[index]!==null)advance();}
function skip(){answers[index]=null;advance();}
function advance(){if(index<questions.length-1){index++;renderQuestion();}else result();}
function reset(){answers=questions.map(()=>null);index=0;start();}
function reflection(score) {
  if (score === null) return '';
  const themes = [
    {cat:'Rights & equality',name:'fairness',text:'You seem to care deeply about fairness. Democracy feels personal when people are treated with equal respect, their rights are protected, and their communities have room to belong. The dignity of each person is an important part of that picture.'},
    {cat:'Representation',name:'voting and a real say',text:'You seem to care deeply about voting and having a real say. Being represented means more than being counted: it is the feeling that your voice belongs in the decisions that shape your life. A connection between people and those who represent them seems meaningful to you.'},
    {cat:'Participation',name:'being heard',text:'You seem to care deeply about people being heard. Democracy can feel close to everyday life when there is room for ordinary people, different experiences and quieter voices. Belonging to the conversation seems to be a meaningful part of your picture.'},
    {cat:'Accountability',name:'trust',text:'You seem to care deeply about trust. The relationship between people and those making decisions matters: being listened to, being treated with care, and knowing that public power comes with responsibility. A democracy that feels dependable seems meaningful to you.'}
  ];
  const signals=themes.map(t=>{
    const values=questions.flatMap((q,i)=>q.cat===t.cat&&answers[i]!==null?[Math.abs(2-answers[i])]:[]);
    return {...t,weight:values.length?values.reduce((a,b)=>a+b,0)/values.length:-1};
  }).filter(t=>t.weight>=0);
  const strongest=Math.max(...signals.map(t=>t.weight));
  const matched=signals.filter(t=>t.weight===strongest);
  let personal;
  if(strongest===0) personal='Your answers leave room for different ways of seeing democracy. Your perspective feels open to the little details: how people are treated, how voices are heard, and how a shared decision feels to the people living with it.';
  else if(matched.length===1) personal=matched[0].text;
  else personal='Your answers seem to hold several things close: '+matched.map(t=>t.name).join(', ')+'. These ideas sit alongside one another in your picture of democracy. It is a picture with room for both individual lives and the things people share.';
  const overall=score>=75?'There is a sense of warmth in how you see many of these democratic ideas. You found a lot that feels meaningful in the way people are represented, protected or included.':score>=50?'Your picture of democracy has more than one shade. Some ideas feel reassuring, while others feel less settled. Those feelings can sit comfortably beside each other in one perspective.':score>=25?'Your answers seem to carry a wish for democracy to feel closer to people’s lives. A sense of belonging, respect and a meaningful voice may be part of what makes that picture feel complete to you.':'Your answers leave a lot of space for a different picture of democracy. There may be a particular kind of fairness, belonging or shared voice that would make it feel more like yours.';
  return `<section class="long-reflection"><h3>A little reflection, just for you</h3><p>${personal}</p><p>${overall}</p><p>Behind these big ideas are small, human things: feeling included, knowing your voice matters, and being treated with care. Your answers offer a little glimpse of what democracy feels like through your eyes. This reflection belongs to this moment; it is not a fixed label for who you are.</p></section>`;
}

function result() {
  screen='result';const valid=answers.filter(a=>a!==null),score=valid.length?Math.round(valid.reduce((s,a)=>s+(4-a)*25,0)/valid.length):null;
  show(`<section class="result"><div class="eyebrow">Your democracy reflection</div><h2>Canada, through your eyes.</h2><div class="score">${score===null?'—':score}<small> / 100</small></div><p class="lead">${score===null?'Your reflection is waiting for a little piece of your perspective.':score>=75?'You found a lot that feels meaningful to you.':score>=50?'Your perspective has room for more than one feeling.':score>=25?'A democracy that feels close to people seems meaningful to you.':'Your own picture of democracy has room to feel different.'}</p><p class="fine">${valid.length} of ${questions.length} topics rated · ${questions.length-valid.length} skipped</p><div class="breakdown">${['Representation','Rights & equality','Participation','Accountability'].map(cat=>{const vals=questions.map((q,i)=>q.cat===cat?answers[i]:null).filter(a=>a!==null);const n=vals.length?Math.round(vals.reduce((s,a)=>s+(4-a)*25,0)/vals.length):null;return `<div class="row"><span>${cat}</span><div class="bar"><span style="width:${n||0}%"></span></div><span>${n===null?'—':n}</span></div>`;}).join('')}</div>${reflection(score)}<p class="fine">This is your perception, not an objective democracy index or a personality diagnosis.<br>Each rated answer contributes equally: 100, 75, 50, 25 or 0. Skipped questions are excluded.</p><details class="review"><summary>Review your answers</summary>${questions.map((q,i)=>`<p>${i+1}. ${q.title}<b>${answers[i]===null?'Skipped':labels[answers[i]]}</b></p>`).join('')}</details><button class="primary" onclick="reset()">Reflect again <span>↻</span></button><p class="fine">Your answers stay in this tab and disappear when you reload.</p></section>`);
}
function about(){show(`<section class="about"><div class="eyebrow">About this experiment</div><h2>Democracy is a question<br>worth sitting with.</h2><p>This independent questionnaire explores fifteen concepts in Canadian government. It is not a validated research instrument or an official assessment.</p><p>After each rating, one or two of the five circles light up at the positions of fictional ratings. Hover, focus or tap a glowing circle to read a short opinion and the character’s age, social class and ethnicity.</p><p>All characters, demographic details, ratings and reasons are AI-generated fiction written for this experience. They are not real participants or evidence about any group. A character’s identity does not determine their opinion. These examples are fixed locally, not generated by an online AI service.</p><p>The introductions summarize complex institutions. Your final score averages rated answers equally; skipped topics are excluded.</p><p>No analytics, accounts, cookies or answer storage. Your answers exist only in this page’s memory and are cleared on reload.</p><button class="primary" onclick="${screen==='quiz'?'renderQuestion()':screen==='result'?'result()':'home()'}">Back to reflection <span>←</span></button></section>`);}
home();

</script></body></html>
